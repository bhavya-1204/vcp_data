name: VCP Stock Analysis

on:
  workflow_dispatch:

jobs:
  vcp-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Final VCP Analysis
        run: |
          python final_vcp.py

      - name: Upload VCP Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcp-results
          path: vcp_results.csv
          retention-days: 30